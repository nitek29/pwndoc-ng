        involontairement une fonctionnalité dans une application Web vulnérable
        qui profitera à l'attaquant et au détriment de l'utilisateur
        concerné.</p><p>Plus précisément, l'attaque est menée.
      observation: "<ul><li><p>Contrôle d'accès\_: DoS\_: crash, sortie ou redémarrage\_: les conséquences varient en fonction de la nature de la fonctionnalité vulnérable au CSRF."
      remediation: >-
