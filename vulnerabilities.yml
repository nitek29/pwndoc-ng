- cvssv3: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N'
  priority: 3
  remediationComplexity: 2
  details:
    - locale: fr
      title: Environnement hors production exposés
      vulnType: OWASP WSTG
      description: >-
        <p>Les environnements hors production désignent toute configuration
        utilisée à des fins autres que les applications opérationnelles. Il
        s'agit notamment des environnements de développement, de test, de
        staging et d'assurance qualité (QA). Ils sont essentiels pour préparer
        les logiciels à la production en permettant des tests et des débogages
        approfondis.</p><p>Souvent les environnements de hors production ne sont
        pas aussi bien protégés que leurs homologues en production. Ils mettent
        donc l'organisation en danger sans le savoir.</p>
      observation: >-
        <p><strong>Violation et fuite de données</strong></p><p>Les
        environnements hors production contiennent souvent des données sensibles
        ou confidentielles, parfois en reproduisant des bases de données de
        production pour tester des scénarios réels. L'exposition de ces
        environnements à l'internet sans contrôles de sécurité appropriés peut
        conduire à des violations de données, exposant les données des clients,
        les secrets commerciaux et d'autres informations
        sensibles.</p><p><strong>Exploitation des
        vulnérabilités</strong></p><p>Ces environnements sont souvent moins sûrs
        que les environnements de production, avec des contrôles de sécurité
        plus faibles et des versions logicielles obsolètes. Cela en fait des
        cibles de choix pour les attaquants qui exploitent les vulnérabilités,
        obtiennent un accès non autorisé et peuvent utiliser ces environnements
        comme base de lancement pour des attaques sur les systèmes de
        production.</p><p><strong>Exposition de la propriété
        intellectuelle</strong></p><p>Les environnements d'essai peuvent
        contenir des fonctionnalités ou des produits à venir qui ne sont pas
        encore publics. L'exposition de ces éléments à l'internet peut entraîner
        la perte de la propriété intellectuelle, en donnant aux concurrents un
        aperçu des projets futurs ou en permettant à des entités malveillantes
        de copier ou de saboter des projets non encore
        diffusés.</p><p><strong>Problématique de conformité</strong></p><p>Pour
        les industries régies par des réglementations strictes en matière de
        protection des données, l'exposition d'un environnement de transit
        contenant des données sensibles ou personnelles peut entraîner des
        violations de la conformité, avec des amendes élevées et des
        conséquences juridiques.</p>
      remediation: >-
        <p><strong>Segmentation du réseau</strong></p><p>Isolez l'environnement
        de préparation de l'internet public et du réseau de production. Utilisez
        des pare-feu et des réseaux privés virtuels pour restreindre l'accès, en
        veillant à ce que seul le personnel autorisé puisse y
        accéder.</p><p><strong>Assainissement des données</strong></p><p>Évitez
        d'utiliser des données réelles dans l'environnement de préparation. Si
        des données réelles sont nécessaires, veillez à ce qu'elles soient
        anonymisées ou assainies de manière adéquate afin d'éviter toute
        fuite.</p><p><strong>Mises à jour régulières et pratiques de
        sécurité</strong></p><p>Appliquer les mêmes mesures de sécurité en phase
        d'essai qu'en phase de production. Mettez régulièrement à jour et
        corrigez les systèmes, effectuez des audits de sécurité et surveillez le
        trafic réseau afin de détecter les menaces et d'y répondre
        rapidement.</p>
      references:
        - >-
          https://brackish.io/penetration-testing-findings-exposed-non-production-environments
      customFields: []
  category: Gestion de la configuration et du déploiement
