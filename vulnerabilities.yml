      vulnType: OWASP WSTG
      description: >-
        <p>Toutes les applications doivent implémenter un délai d'inactivité
        pour les sessions.
      observation: "<ul><li><p>Contrôle d'accès\_: contourner le mécanisme de protection\_: un attaquant pourrait rester connecté pendant une longue période, ce qui pourrait réutiliser des identifiants et des références directes anciens ou supprimés.</p></li></ul>"
      remediation: >-
        <p>Le côté serveur doit implémenter la gestion des délais d'expiration
        et de l'expiration des sessions.
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/07-Testing_Session_Timeout
        - 'https://cwe.mitre.org/data/definitions/1018.html'
      customFields: []
  category: Gestion des sessions
- cvssv3: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:L/A:N'
  details:
    - locale: fr
      title: Détournement de session
      vulnType: OWASP WSTG
      description: >-
        <p>L'attaque de détournement de session consiste à exploiter le
        mécanisme de contrôle de session Web, qui est normalement géré pour un
        jeton de session.</p><p>La communication http utilisant de nombreuses
        connexions TCP différentes, le serveur Web a besoin d'une méthode pour
        reconnaître chacune d'elles.
      observation: "<ul><li><p>Contrôle d'accès\_: contourner le mécanisme de protection\_: un attaquant pourrait rester connecté pendant une longue période, ce qui pourrait réutiliser des identifiants et des références directes anciens ou supprimés.</p></li></ul>"
      remediation: >-
        <p>Utilisez des processus de génération de clés de session standard du
        secteur qui génèrent des clés de session en utilisant beaucoup
        d'entropie, et chiffrez et signez correctement les jetons d'identité en
        transit.
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/09-Testing_for_Session_Hijacking
        - 'https://capec.mitre.org/data/definitions/593.html'
      customFields: []
  category: Gestion des sessions
- cvssv3: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:L/A:N'
  details:
    - locale: fr
      title: Connexions simultanées mal contrôlées.
      vulnType: OWASP WSTG
      description: >-
        <p>Les applications nécessitant une authentification ne doivent
        autoriser qu'une seule session active par utilisateur et ne doivent pas
        autoriser plusieurs sessions utilisateur authentifiées sur différents
        navigateurs ou ordinateurs.</p>
      observation: "<ul><li><p>Contrôle d'accès\_: contourner le mécanisme de protection\_: un attaquant pourrait rester connecté pendant une longue période, ce qui pourrait réutiliser des identifiants et des références directes anciens ou supprimés.</p></li></ul>"
      remediation: >-
        <p>Il est conseillé que les sessions d'un même utilisateur ne
        s'exécutent pas simultanément et qu'ils reçoivent toujours une
        notification lorsqu'une ancienne session est toujours active.</p>
      references:
        - 'https://owasp.org/www-community/attacks/Session_hijacking_attack'
      customFields: []
  category: Gestion des sessions
- cvssv3: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N'
  details:
    - locale: fr
      title: (générique) Échec de la désinfection de l'entrée
      vulnType: OWASP WSTG
      description: >-
        <p>L'utilisation incorrecte d'éléments spéciaux dans les entrées
        contrôlées par l'utilisateur n'est pas correctement filtrée, supprimée,
        citée ou autrement gérée par le produit, ce qui pourrait avoir un impact
        négatif sur son comportement et son intégrité.</p>
      observation: "<ul><li><p>Disponibilité\_:\_DoS\_: crash, sortie ou redémarrage\_: les contrôles de validation côté client peuvent être facilement contournés, permettant ainsi à des entrées mal formées ou inattendues de passer dans l'application, potentiellement en tant que données fiables."
      remediation: >-
        <p>Les développeurs doivent s'attendre à ce que des éléments spéciaux
        soient injectés/supprimés/manipulés dans les vecteurs d'entrée de leur
        système logiciel.
      references:
        - 'https://cwe.mitre.org/data/definitions/159.html'
      customFields: []
  category: Validation des entrées
