  details:
    - locale: fr
      title: Pollution des paramètres HTTP (HPP)
      vulnType: OWASP WSTG
      description: >-
        <p>La pollution des paramètres HTTP profite du comportement incorrect de
        l'application lors de la réponse à des requêtes HTTP qui ont le même
        paramètre défini sur le serveur mais qui ont été envoyées avec des
        valeurs différentes.
      observation: "<ul><li><p>Intégrité\_: état inattendu\_: un attaquant pourrait manipuler les paramètres de l'application</p></li></ul>"
      remediation: >-
        <p>Ce type d'attaque serait évité en nettoyant correctement les données
        d'entrée, en vérifiant le nombre d'instances de paramètres individuels
        dans une requête et en recherchant les requêtes avec des affectations en
        double.</p>
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/04-Testing_for_HTTP_Parameter_Pollution
        - 'https://cwe.mitre.org/data/definitions/235.html'
        - 'https://capec.mitre.org/data/definitions/460.html'
      customFields: []
  category: Validation des entrées
