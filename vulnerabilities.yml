        <p>La prévention des attaques Cross-site Scripting (XSS) n'est pas
        triviale selon la complexité de l'application et la façon dont elle gère
        les données contrôlables par l'utilisateur et le type de vulnérabilité
        Cross-site Scripting (XSS).</p><p>
      references:
