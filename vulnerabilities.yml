      title: Scripts intersites (XSS) basés sur DOM
      vulnType: OWASP WSTG
      description: >-
        <p>Une attaque XSS connue sous le nom de XSS basé sur DOM provoque
        l'exécution de code côté client de manière « inattendue » en modifiant «
        l'environnement » DOM que le navigateur de la victime a été conçu pour
        utiliser par le script côté client d'origine.
      observation: "<ul><li><p>Confidentialité\_: lecture des données d'application\_: l'attaque la plus courante effectuée avec des scripts intersites implique la divulgation d'informations stockées dans les cookies des utilisateurs."
      remediation: >-
        <p>Aucune action à elle seule ne peut éliminer complètement la menace
        des attaques basées sur le DOM.
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/01-Testing_for_DOM-based_Cross_Site_Scripting
        - 'https://cwe.mitre.org/data/definitions/79.html'
