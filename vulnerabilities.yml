      vulnType: OWASP WSTG
      description: >-
        <p>Grâce à une attaque XSS (Cross-Site Scripting), un attaquant peut
        insérer du code malveillant qui s'exécute dans le navigateur de la
        victime, prendre le contrôle du navigateur et l'utiliser pour accéder
        aux informations d'identification, aux données sensibles ou aux données
        de session de l'application concernée.
      observation: "<ul><li><p>Confidentialité\_: lecture des données d'application\_: l'attaque la plus courante effectuée avec des scripts intersites implique la divulgation d'informations stockées dans les cookies des utilisateurs."
