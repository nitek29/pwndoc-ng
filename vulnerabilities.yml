      vulnType: OWASP WSTG
      description: >-
        <p>La vulnérabilité « Cross-Site Scripting (XSS) » permet à des tiers
        d'injecter du code Java Script ou HTML dans des pages Web d'applications
        spécifiques.
      observation: "<ul><li><p>Confidentialité\_: lecture des données d'application\_: l'attaque la plus courante effectuée avec des scripts intersites implique la divulgation d'informations stockées dans les cookies des utilisateurs."
      remediation: >-
        <p>Chaque paramètre géré par l'application doit être validé, notamment
        lorsqu'il s'agit de données d'entrée fournies par l'utilisateur.
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/01-Testing_for_Reflected_Cross_Site_Scripting
        - 'https://owasp.org/www-community/attacks/xss/'
