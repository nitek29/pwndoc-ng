      title: Mauvaise configuration du partage de ressources Cross-Origin (CORS)
      vulnType: OWASP WSTG
      description: <p>CORS signifie Cross-Origin Resource Sharing.
      observation: "<ul><li><p>Autre\_: varie selon le contexte\_: un attaquant peut accéder à toute fonctionnalité accessible par inadvertance à la source.</p></li></ul>"
