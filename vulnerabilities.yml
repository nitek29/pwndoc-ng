- cvssv3: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:N/A:N'
  details:
    - locale: fr
      title: Injection de contenu CSS
      vulnType: OWASP WSTG
      description: >-
        <p>Semblable au fonctionnement des injections HTML ou XSS, les
        injections CSS donnent aux pirates la possibilité d'insérer du code CSS
        côté client, que le navigateur de la victime interprétera ensuite
        lorsqu'elle visitera une URL.
      observation: "<ul><li><p>Disponibilité\_: DoS\_: consommation de ressources (mémoire)\_: un attaquant pourrait fournir des valeurs inattendues et provoquer un crash du programme ou une consommation excessive de ressources, telles que la mémoire et le processeur.</p></li>"
      remediation: >-
        <p>Ce type d'attaque peut être stoppé en validant correctement le
        contenu que le serveur reçoit et envoie, ou en nettoyant correctement
        les entrées de l'utilisateur.</p>
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/05-Testing_for_CSS_Injection
        - >-
          https://research.securitum.com/css-data-exfiltration-in-firefox-via-single-injection-point/
        - 'https://cwe.mitre.org/data/definitions/20.html'
      customFields: []
  category: Web côté client
